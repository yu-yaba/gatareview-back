inherit_from: .rubocop_todo.yml

AllCops:
  NewCops: disable
  SuggestExtensions: false
  Exclude:
    - 'bin/**/*'
    - 'db/**/*'
    - 'config/**/*'
    - 'vendor/**/*'
    - 'tmp/**/*'
    - 'test/**/*'

Style/Documentation:
  Enabled: false

Metrics/BlockLength:
  Exclude:
    - 'spec/**/*'

# Existing CSV/controller complexity baseline; authentication remains fully checked.
Metrics/ClassLength:
  Exclude:
    - 'app/controllers/api/v1/lectures_controller.rb'
Metrics/PerceivedComplexity:
  Exclude:
    - 'app/controllers/api/v1/lectures_controller.rb'
