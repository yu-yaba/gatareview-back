inherit_from: .rubocop_todo.yml

AllCops:
  NewCops: disable
  SuggestExtensions: false
  Exclude:
    - 'bin/**/*'
    - 'db/**/*'
    - 'config/**/*'
    - 'vendor/**/*'
    - 'tmp/**/*'
    - 'test/**/*'

Style/Documentation:
  Enabled: false

Metrics/BlockLength:
  Exclude:
    - 'spec/**/*'

# Existing syllabus/timetable feature baseline; keep authentication fully checked.
Lint/RedundantRequireStatement:
  Exclude:
    - 'app/services/syllabus/database_audit.rb'
    - 'app/services/syllabus/import_analyzer.rb'
Metrics/ClassLength:
  Exclude:
    - 'app/controllers/api/v1/lectures_controller.rb'
    - 'app/services/syllabus/import_analyzer.rb'
    - 'app/services/syllabus/import_applier.rb'
    - 'app/services/syllabus/lecture_csv_exporter.rb'
Metrics/MethodLength:
  Exclude:
    - 'app/services/syllabus/lecture_csv_importer.rb'
Metrics/ParameterLists:
  Exclude:
    - 'app/services/syllabus/import_analyzer.rb'
    - 'app/services/syllabus/lecture_csv_exporter.rb'
    - 'spec/services/syllabus/import_analyzer_spec.rb'
Metrics/PerceivedComplexity:
  Exclude:
    - 'app/controllers/api/v1/lectures_controller.rb'
    - 'app/controllers/api/v1/timetables_controller.rb'
    - 'app/services/syllabus/import_applier.rb'
Style/MultilineBlockChain:
  Exclude:
    - 'app/services/syllabus/import_analyzer.rb'
