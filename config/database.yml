default: &default
  adapter: postgresql
  encoding: unicode
  # 1プロセス（Puma の各ワーカー）が持つ接続の上限。スレッド数と同じにする。
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  username: <%= ENV["POSTGRES_USER"] %>
  password: <%= ENV["POSTGRES_PASSWORD"] %>
  host: <%= ENV["POSTGRES_HOST"] %>
  port: <%= ENV.fetch("POSTGRES_PORT", 5432) %>
  connect_timeout: 10
  # MySQL の read_timeout: 10 に相当する上限。1つの SQL が10秒を超えたら打ち切る。
  variables:
    statement_timeout: 10s
  # Rails 7.0での安定性向上（接続プール経由でも同じ挙動にするため、引き続き無効にする）
  prepared_statements: false

development:
  <<: *default
  database: <%= ENV["POSTGRES_DB"] %>

test:
  <<: *default
  database: app_test

production:
  <<: *default
  # DB（カリフォルニア）までの往復が遠く、新しい接続を作るのに約1.5秒かかる（TLS・認証・設定の SQL が
  # 約11往復）。アクセスが少ないと接続がすぐ空になり、利用者のリクエストがその1.5秒を待つことになる。
  # そこで各ワーカーに最低2本の接続を常に用意しておく。足りない分は Rails の定期処理（reaper、
  # 約20秒ごと）が裏で作り、使われていない接続にも定期的に通信して生かしておく（keepalive、既定600秒）。
  # 2本を超えて作った接続は、30分使われなければ閉じる。
  # 本数の目安: 2ワーカー × 2本 = 常時4本。混んだときの上限は 2ワーカー × RAILS_MAX_THREADS = 10本。
  # Aiven 無料プランで使えるのは17本（20本のうち3本は管理用）。常時分は新旧の dyno が重なっても収まるが、
  # 混んだ dyno が2つ重なると上限を超えうる（docs/database-connection-reuse.md）。
  min_connections: <%= ENV.fetch("DB_MIN_CONNECTIONS") { 2 } %>
  idle_timeout: 1800
  url: <%= ENV['DATABASE_URL'] %>
  # 証明書とホスト名の両方を検証する。DATABASE_URL の sslmode はこの値より優先されるため、
  # verify-full 以外になっていれば起動時に止める（lib/database_tls_configuration.rb）。
  sslmode: verify-full
  # DB 提供元の CA 証明書のパス（必須）。pg gem の同梱 libpq は OS の CA ストアを見ない
  # （sslrootcert=system が /etc/ssl/certs を読まない）ため、未設定なら起動時に止める。
  sslrootcert: <%= ENV['DATABASE_SSL_CA'].to_s.inspect %>
