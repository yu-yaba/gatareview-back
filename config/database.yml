default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  username: <%= ENV["POSTGRES_USER"] %>
  password: <%= ENV["POSTGRES_PASSWORD"] %>
  host: <%= ENV["POSTGRES_HOST"] %>
  port: <%= ENV.fetch("POSTGRES_PORT", 5432) %>
  connect_timeout: 10
  # MySQL の read_timeout: 10 に相当する上限。1つの SQL が10秒を超えたら打ち切る。
  variables:
    statement_timeout: 10s
  # Rails 7.0での安定性向上（接続プール経由でも同じ挙動にするため、引き続き無効にする）
  prepared_statements: false

development:
  <<: *default
  database: <%= ENV["POSTGRES_DB"] %>

test:
  <<: *default
  database: app_test

production:
  <<: *default
  # Reuse connections between sparse requests; keep the existing pool limit.
  # Rails still verifies connections and closes them after 30 idle minutes.
  idle_timeout: 1800
  url: <%= ENV['DATABASE_URL'] %>
  # 証明書とホスト名の両方を検証する。DATABASE_URL の sslmode はこの値より優先されるため、
  # verify-full 以外になっていれば起動時に止める（lib/database_tls_configuration.rb）。
  sslmode: verify-full
  # DB 提供元の CA 証明書のパス（必須）。pg gem の同梱 libpq は OS の CA ストアを見ない
  # （sslrootcert=system が /etc/ssl/certs を読まない）ため、未設定なら起動時に止める。
  sslrootcert: <%= ENV['DATABASE_SSL_CA'].to_s.inspect %>
